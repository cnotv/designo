# For a server with no reverse proxy yet: adds Caddy on 80 and 443, with an HTTPS certificate for
# DESIGNO_DOMAIN and basic auth, read from .env. Kept in its own file so a server that already
# runs a reverse proxy never needs these variables:
#   docker compose -f docker-compose.yml -f docker-compose.caddy.yml up -d
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [designo]
    ports:
      - 80:80
      - 443:443
      - 443:443/udp
    environment:
      DESIGNO_DOMAIN: ${DESIGNO_DOMAIN:?Set DESIGNO_DOMAIN in .env}
      DESIGNO_USER: ${DESIGNO_USER:?Set DESIGNO_USER in .env}
      DESIGNO_PASSWORD_HASH: ${DESIGNO_PASSWORD_HASH:?Set DESIGNO_PASSWORD_HASH in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  caddy-data:
  caddy-config:
