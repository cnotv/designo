# Deploys to a Hetzner Cloud server set up as in deploy/hetzner/README.md. It stays off until the
# repository variable HETZNER_DEPLOY is "true", so a fork or a fresh clone never fails a deploy.
name: Deploy to Hetzner

on:
  push:
    branches: [main]
    paths: ['packages/**', 'pnpm-lock.yaml', 'Dockerfile', 'docker-compose*.yml', 'Caddyfile']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  run-tests:
    if: vars.HETZNER_DEPLOY == 'true'
    uses: ./.github/workflows/test.yml

  build-and-push:
    needs: run-tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Designo's own folder, relative to the SSH user's home unless absolute. Never the home
      # itself or a folder another app on the server uses: its docker-compose.yml would be
      # replaced by this one.
      DEPLOY_DIRECTORY: ${{ vars.DEPLOY_DIRECTORY || 'designo' }}
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Create Designo's own folder on the server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USERNAME }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          port: ${{ secrets.HETZNER_PORT || '22' }}
          envs: DEPLOY_DIRECTORY
          script: |
            set -eu
            case "$DEPLOY_DIRECTORY" in
              '' | . | ./ | / | '~' | '~/' | *..*)
                echo "DEPLOY_DIRECTORY must name Designo's own folder, not '$DEPLOY_DIRECTORY'" >&2
                exit 1 ;;
            esac
            mkdir -p "$DEPLOY_DIRECTORY"

      - name: Copy the compose file to the server
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USERNAME }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          port: ${{ secrets.HETZNER_PORT || '22' }}
          source: docker-compose.yml
          target: ${{ env.DEPLOY_DIRECTORY }}
      - name: Start the new image
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USERNAME }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          port: ${{ secrets.HETZNER_PORT || '22' }}
          envs: DEPLOY_DIRECTORY
          script: |
            # Without this a failed pull still reports success, and the old container keeps
            # running behind a green deploy.
            set -e
            cd "$DEPLOY_DIRECTORY"

            cat > .env <<'ENV'
            DESIGNO_PORT='${{ vars.DESIGNO_PORT || '3020' }}'
            DESIGNO_BIND='${{ vars.DESIGNO_BIND || '127.0.0.1' }}'
            ENV

            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose pull
            docker compose up -d --no-build --remove-orphans
            docker logout ghcr.io
            docker image prune -f
