# Adapted from cnotv/generative-art's test workflow: agent-base ships no CI for consumer repositories.
name: Tests

on:
  workflow_call:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check-rebase:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check the branch is rebased on main
        run: |
          git fetch origin main
          BEHIND=$(git rev-list --count HEAD..origin/main)
          if [ "$BEHIND" -gt "0" ]; then
            echo "::error::Branch is $BEHIND commits behind main. Rebase: git fetch origin main && git rebase origin/main"
            exit 1
          fi

  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint:check
      - run: pnpm format:check
      - run: pnpm type-check
      - run: pnpm test:unit
      - run: pnpm build

  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      # Headless Chromium draws WebGL2 with SwiftShader, so the runner needs no GPU.
      - run: pnpm --filter @designo/parity exec playwright install --with-deps chromium
      - run: pnpm test:parity
        env:
          PARITY_OUT: ${{ github.workspace }}/parity-report
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: render-parity
          path: parity-report
          if-no-files-found: ignore
