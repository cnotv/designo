name: Docs to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['documentation/**', '.github/workflows/github-pages.yml']
  pull_request:
    paths: ['documentation/**', '.github/workflows/github-pages.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: documentation/pnpm-lock.yaml
      # The docs site keeps its own lockfile outside the workspace, as in generative-art.
      - run: pnpm install --frozen-lockfile --ignore-workspace
        working-directory: documentation
      - run: pnpm build
        working-directory: documentation
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: documentation/build

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
