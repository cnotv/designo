# Designo on its own: `docker compose up -d` publishes it on 127.0.0.1:3020, for a reverse proxy
# on the same host to route to. Port 3020 keeps clear of other apps on the server (3000 and 3001
# are taken). Change the port or bind address with DESIGNO_PORT and DESIGNO_BIND in .env.
# The files API has no login: the reverse proxy in front must add one.
services:
  designo:
    image: ghcr.io/cnotv/designo:latest
    build: .
    container_name: designo
    restart: unless-stopped
    ports:
      - ${DESIGNO_BIND:-127.0.0.1}:${DESIGNO_PORT:-3020}:3000
    volumes:
      - designo-data:/data

volumes:
  designo-data:
